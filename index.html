<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dialogue Flow</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#eee9da;font:14px/1.5 system-ui,sans-serif}header,main,footer{width:min(1280px,calc(100% - 32px));margin:auto}header{height:60px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:19px}a{color:#ddbd77;text-underline-offset:3px}button{font:inherit;cursor:pointer;border:1px solid #64717a;background:#24313a;color:#eee9da;border-radius:6px;padding:8px 14px}button:hover{border-color:#ddbd77}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #ddbd77;outline-offset:4px}.stage{position:relative;aspect-ratio:16/9;background:#0a1117;border:1px solid #374851;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#101820}#start{background:#ddbd77;color:#101820;font-weight:700;border:0;padding:14px 28px}progress{accent-color:#ddbd77;width:260px;max-width:80vw}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0}.actions{display:flex;gap:8px}#status{color:#becbd1}footer{color:#aebdc5;font-size:12px;padding-bottom:16px}footer a{color:inherit}[hidden]{display:none!important}@media(max-width:640px){header,main,footer{width:calc(100% - 20px)}.toolbar{flex-wrap:wrap;gap:8px}#status{font-size:12px}}
  </style>
</head>
<body>
  <header><strong>Dialogue Flow</strong><a href="https://github.com/pktony/DialogueFlow">GitHub</a></header>
  <main>
    <section class="stage" aria-label="Village Gate game">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Village Gate. WASD to move, E to talk."></canvas>
      <div class="overlay" id="overlay"><button id="start" type="button">Play</button><span id="loading-title" role="status"></span><progress id="progress" max="1" value="0" aria-label="Loading game" hidden></progress></div>
    </section>
    <div class="toolbar"><span id="status" role="status">WASD move · E talk · Click / Space continue · 1–3 choose</span><div class="actions"><button id="restart" type="button">Restart</button><button id="fullscreen" type="button" disabled>Fullscreen</button></div></div>
  </main>
  <footer>Noto Sans KR · <a href="OFL.txt">Font license</a></footer>
  <script>
    const canvas=document.querySelector('#unity-canvas'),status=document.querySelector('#status'),overlay=document.querySelector('#overlay'),progress=document.querySelector('#progress'),start=document.querySelector('#start'),title=document.querySelector('#loading-title');
    let game;
    function fail(message){overlay.hidden=false;title.textContent=message;progress.hidden=true;status.textContent='Loading failed. Restart to try again.';}
    start.addEventListener('click',()=>{
      start.hidden=true;progress.hidden=false;title.textContent='Loading…';
      const loader=document.createElement('script');loader.src='Build/WebGL.loader.js';loader.onerror=()=>fail('Unable to download the player.');
      loader.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/WebGL.data.unityweb',frameworkUrl:'Build/WebGL.framework.js.unityweb',codeUrl:'Build/WebGL.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'pktony',productName:'Dialogue Flow',productVersion:'0.5.0',showBanner:(message,type)=>{if(type==='error')fail(message);}},value=>{progress.value=value;title.textContent=`Loading ${Math.round(value*100)}%`;}).then(instance=>{game=instance;overlay.hidden=true;document.querySelector('#fullscreen').disabled=false;canvas.focus();}).catch(error=>fail(String(error)));
      document.body.append(loader);
    });
    canvas.addEventListener('click',()=>canvas.focus());
    canvas.addEventListener('keydown',event=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(event.key))event.preventDefault();});
    document.querySelector('#fullscreen').addEventListener('click',()=>game?.SetFullscreen(1));
    document.querySelector('#restart').addEventListener('click',()=>location.reload());
  </script>
</body>
</html>
